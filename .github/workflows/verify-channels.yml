name: Verify published channels

# The release workflows can be green while a channel holds nothing — a
# channel can silently keep serving the previous release. This job probes the
# artifacts themselves (npm, GitHub Release, AUR, Homebrew tap, Scoop bucket,
# Nix flake), so "green" means "a user can install this version".
#
# The wait is there because npm, the AUR and Homebrew publish
# asynchronously — a tag push can be minutes ahead of the artifact.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "version to verify (e.g. 1.7.2)"
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every channel serves the release
        run: |
          ver="${{ github.event.inputs.version || github.ref_name }}"
          ver="${ver#v}"
          sh scripts/verify-channels.sh "$ver" --wait 20
