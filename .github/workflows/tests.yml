name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Warnings and errors must be zero. The 2026-09-28 audit found SC2319
      # (`[ ... ] && exit $?`, which silently returned the test's status
      # instead of the player's) and SC1083 already shipped to master past a
      # green suite, because the self-checks cover parsers and arg validation,
      # not exit-code plumbing. Info-level findings are reported but not
      # enforced: SC2086 is deliberate word-splitting and SC2059 is #38.
      # pinned to a release SHA: @master re-resolves on every run, so whoever
      # controls that repo decides what runs in this workflow
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38  # v2.0.0
        with:
          scandir: .
          severity: warning
          additional_files: install.sh

  self-checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # /bin/sh (dash on Debian/Ubuntu, bash on Arch/Fedora) can behave
        # differently — cf. the bare-`wait` interrupt bug — so every suite
        # runs under each shell explicitly.
        shell: [sh, dash, bash]
        # macOS as well: its userland is BSD (sed, cut, awk, mktemp), and the
        # `rev`-on-macOS breakage sat unnoticed for months because CI was
        # Linux-only. macOS ships no dash, and its sh and bash are 3.2 — the
        # oldest shell the suite ever runs under, which is the point.
        os: [ubuntu-latest, macos-latest]
        exclude:
          - os: macos-latest
            shell: dash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax (${{ matrix.os }} ${{ matrix.shell }})
        run: ${{ matrix.shell }} -n vicine

      - name: Self-checks under ${{ matrix.shell }}
        env:
          VICINE: ${{ matrix.shell }} ${{ github.workspace }}/vicine
        run: |
          set -e
          for t in tests/*.sh; do echo "== $t"; ${{ matrix.shell }} "$t"; done