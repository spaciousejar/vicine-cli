name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Warnings and errors must be zero. The 2026-09-28 audit found SC2319
      # (`[ ... ] && exit $?`, which silently returned the test's status
      # instead of the player's) and SC1083 already shipped to master past a
      # green suite, because the self-checks cover parsers and arg validation,
      # not exit-code plumbing. Info-level findings are reported but not
      # enforced: SC2086 is deliberate word-splitting and SC2059 is #38.
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: .
          severity: warning
          additional_files: install.sh

  self-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # /bin/sh (dash on Debian/Ubuntu, bash on Arch/Fedora) can behave
        # differently — cf. the bare-`wait` interrupt bug — so every suite
        # runs under each shell explicitly.
        shell: [sh, dash, bash]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax (${{ matrix.shell }})
        run: ${{ matrix.shell }} -n vicine

      - name: Self-checks under ${{ matrix.shell }}
        env:
          VICINE: ${{ matrix.shell }} ${{ github.workspace }}/vicine
        run: |
          set -e
          for t in tests/*.sh; do echo "== $t"; ${{ matrix.shell }} "$t"; done