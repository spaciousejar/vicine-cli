name: Scheduled audit

# The 19-bug audit found more real issues than everything else combined, and
# it arrived by luck (fresh eyes). Make the cadence a machine, not memory:
# open a checklist issue monthly; the maintainer runs the external audit,
# then closes it with findings.

on:
  schedule:
    - cron: "0 9 1 * *"   # 1st of the month, 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - name: Open audit issue if none is open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open="$(gh issue list --state open --search 'Scheduled audit in:title' --json number -q 'length' 2>/dev/null || echo 0)"
          if [ "$open" != 0 ]; then echo "audit issue already open - skipping"; exit 0; fi
          body='## Scheduled audit due

          Fresh-eyes pass over the current vicine codebase.

          - [ ] Run the self-checks: sh tests/*.sh (and under bash and dash)
          - [ ] Review commits since the last release (git log --oneline v1.x..HEAD)
          - [ ] Focus areas: download paths (do_download, .part, _stage_ok),
                provider fallback chains (server-1/2/3), shell portability
                (sh/dash/bash)
          - [ ] Confirm the packaged pins advanced with the latest tag (release-verify)
          - [ ] Open findings as separate issues; close this one when done'
          gh issue create --title "Scheduled audit: $(date +%Y-%m)" --body "$(printf '%s\n' "$body" | sed 's/^          //')"