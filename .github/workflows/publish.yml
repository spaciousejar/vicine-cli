name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Verify package name
        run: |
          name="$(node -p "require('./package.json').name")"
          test "$name" = "vicine" || {
            echo "::error::package.json name must be 'vicine' for the npmjs publish; got: $name"
            exit 1
          }

      - name: Publish to npmjs
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Print published package location
        run: |
          ver="$(node -p "require('./package.json').version")"
          echo "Published vicine@${ver}"
          echo "https://www.npmjs.com/package/vicine"