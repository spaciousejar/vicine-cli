name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Verify package name
        run: |
          name="$(node -p "require('./package.json').name")"
          test "$name" = "vicine" || {
            echo "::error::package.json name must be 'vicine' for the npmjs publish; got: $name"
            exit 1
          }

      - name: Publish to npmjs
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Print published package location
        run: |
          ver="$(node -p "require('./package.json').version")"
          echo "Published vicine@${ver}"
          echo "https://www.npmjs.com/package/vicine"

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref="$GITHUB_REF_NAME"
          prev="$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            log="$(git log --oneline --no-merges "$prev"..HEAD)"
          else
            log="$(git log --oneline --no-merges | head -30)"
          fi
          printf '## What changed\n\n%s\n' "$log" > /tmp/relnotes.md
          gh release view "$ref" >/dev/null 2>&1 \
            && echo "Release $ref already exists; skipping" \
            || gh release create "$ref" --title "$ref" --notes-file /tmp/relnotes.md