name: Bump packaged versions

# Homebrew (Formula/), Scoop (bucket/), and the Nix flake pin a release
# tarball + checksum. This workflow rewrites those pins on every published
# release so the OS packages don't go stale (like the AUR job does).

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        run: |
          ver="${GITHUB_REF_NAME#v}"
          [ "$ver" = "$GITHUB_REF_NAME" ] && ver="$(git describe --tags --abbrev=0 | sed 's/^v//')"
          case "$ver" in *[!0-9.]*) echo "bad version: $ver" >&2; exit 1 ;; esac
          echo "ver=$ver" >> "$GITHUB_ENV"

      - name: Rewrite version and checksum pins
        run: |
          sha="$(curl -fsSL "https://github.com/spaciousejar/vicine-cli/archive/refs/tags/v${ver}.tar.gz" | sha256sum | cut -d' ' -f1)"
          echo "pinning $ver ($sha)"

          sed -i "s|refs/tags/v[0-9.]*\.tar\.gz|refs/tags/v${ver}.tar.gz|; s|sha256 \"[0-9a-f]*\"|sha256 \"$sha\"|" Formula/vicine.rb
          sed -i "s|refs/tags/v[0-9.]*\.tar\.gz|refs/tags/v${ver}.tar.gz|; s|\"version\": \"[0-9.]*\"|\"version\": \"$ver\"|; s|\"hash\": \"[0-9a-f]*\"|\"hash\": \"$sha\"|" bucket/vicine.json
          sed -i "s/version = \"[0-9.]*\"/version = \"$ver\"/; s|refs/tags/v[0-9.]*\.tar\.gz|refs/tags/v${ver}.tar.gz|; s|sha256 = \"[0-9a-f]*\"|sha256 = \"$sha\"|" flake.nix

          grep -n "1.4\|$ver" Formula/vicine.rb bucket/vicine.json flake.nix | grep -E 'version|refs/tags|sha' || true

      - name: Commit if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: bump packaged versions to ${{ github.ref_name }}"
          file_pattern: Formula/vicine.rb bucket/vicine.json flake.nix

      # `brew tap spaciousejar/vicine-cli` clones the separate
      # homebrew-vicine-cli repo, so the bumped formula is mirrored there.
      - name: Push formula to the Homebrew tap
        env:
          SSH_KEY: ${{ secrets.TAP_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/tap && chmod 600 ~/.ssh/tap
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/tap -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:spaciousejar/homebrew-vicine-cli.git "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          cp "$GITHUB_WORKSPACE/Formula/vicine.rb" Formula/vicine.rb
          if git diff --quiet Formula/vicine.rb; then
            echo "formula unchanged — nothing to push"
          else
            git config user.name spaciousejar
            git config user.email 76901120+spaciousejar@users.noreply.github.com
            git add Formula/vicine.rb
            git commit -m "vicine ${ver}"
            git push -q origin HEAD
          fi